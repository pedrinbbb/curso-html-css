<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    *{
        margin: 0;
        padding: 0;
    }
    .container{
        display: grid;
        grid-template-rows: 50px 40px 200px 40px;
        grid-template-columns: 200px 150px;
        background-color: rgba(216, 113, 113, 0.418);
        border: 1px solid black;
        text-align: center;
    }
    .topo{
        background-color: aqua;
        grid-area: 1 / 1 / 1 / -1;
    }
    .menu{
        background-color: aqua;
        grid-area: 2 / 1 / 2 / 1;
    }
    .principal{
        background-color: aqua;
        grid-area: 3 / 1 / 3 / 3;
    }
</style>
<body>
    <div class="container">
        <div class="topo">
            <h1>topo</h1>
        </div>
        <div class="menu">
            <h1>menu</h1>
        </div>
        <div class="principal">
            <h1>principal</h1>
        </div>
        <div class="secundario">
            <h1>Secundario</h1>
        </div>
        <div class="rodape">
            <h1>rodape</h1>
        </div>
        
        

    </div>
</body>
</html>
