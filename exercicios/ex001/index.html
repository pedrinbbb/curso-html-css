<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Pedido Online</title>
  <style>
    body { font-family: Arial; max-width: 600px; margin: auto; }
    input, select, button { width: 100%; padding: 8px; margin: 5px 0; }
    .hidden { display: none; }
  </style>
</head>
<body>

<h2>🧾 Dados Pessoais</h2>
<input id="nome" placeholder="Nome">
<input id="telefone" placeholder="Telefone">
<input id="email" placeholder="Email (opcional)">

<h2>📍 Endereço</h2>
<input id="rua" placeholder="Rua">
<input id="bairro" placeholder="Bairro">
<input id="numero" placeholder="Número">
<input id="referencia" placeholder="Ponto de referência">
<input id="complemento" placeholder="Complemento">

<h2>💳 Pagamento</h2>
<select id="pagamento" onchange="opcoesPagamento()">
  <option value="">Selecione</option>
  <option value="Pix">Pix</option>
  <option value="Cartão">Cartão</option>
  <option value="Dinheiro">Dinheiro</option>
</select>

<div id="trocoDiv" class="hidden">
  <input id="troco" placeholder="Troco para quanto?">
</div>

<div id="cartaoDiv" class="hidden">
  <select id="tipoCartao">
    <option value="">Crédito ou Débito</option>
    <option value="Crédito">Crédito</option>
    <option value="Débito">Débito</option>
  </select>
</div>

<button onclick="enviarWhatsApp()">Finalizar Pedido</button>

<script>
function opcoesPagamento() {
  let pagamento = document.getElementById("pagamento").value;
  document.getElementById("trocoDiv").classList.add("hidden");
  document.getElementById("cartaoDiv").classList.add("hidden");

  if (pagamento === "Dinheiro") {
    document.getElementById("trocoDiv").classList.remove("hidden");
  }

  if (pagamento === "Cartão") {
    document.getElementById("cartaoDiv").classList.remove("hidden");
  }
}

function enviarWhatsApp() {
  let mensagem =
`🧾 *NOVO PEDIDO*

👤 *Cliente*
Nome: ${nome.value}
Telefone: ${telefone.value}
Email: ${email.value || "Não informado"}

📍 *Endereço*
Rua: ${rua.value}
Bairro: ${bairro.value}
Número: ${numero.value}
Referência: ${referencia.value}
Complemento: ${complemento.value}

💳 *Pagamento*
Forma: ${pagamento.value}`;

  if (pagamento.value === "Dinheiro") {
    mensagem += `\nTroco para: ${troco.value}`;
  }

  if (pagamento.value === "Cartão") {
    mensagem += `\nTipo: ${tipoCartao.value}`;
  }

  mensagem += `\n\n✅ Pedido finalizado. Aguardando confirmação.`;

  let telefoneEmpresa = "85985677491"; // coloque o número da empresa aqui
  let url = `https://wa.me/${telefoneEmpresa}?text=${encodeURIComponent(mensagem)}`;

  window.open(url, "_blank");
}
</script>

</body>
</html>
