<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .container{
        display: grid;
        grid-template: repeat(5, 100px)/ repeat(4, 1fr);
        border: 1px solid black;
    }
    .caixa1{
        background-color: red;
        grid-area: 1 / 1 / 6 /3;
    }
    .caixa2{
        background-color: yellow;
        grid-area: 1 / 3 / 6 / 5;
    }
    
</style>
<body>
    <div class="container">
        <div class="caixa1">
            <p>caixa1</p>
        </div>
        <div class="caixa2">
            <p>caixa2</p>
        </div>
        
        

    </div>
</body>
</html>
